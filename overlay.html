<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>League of Legends Stream Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        body {
            width: 1920px;
            height: 1080px;
            background-color: transparent;
            position: relative;
            overflow: hidden;
        }


        /* --- UNIFIED STAT BAR --- */
        .stat-bar {
            position: absolute;
            top: 230px;
            left: 40px;
            display: flex; /* Aligns items horizontally */
            align-items: center;
            background: rgba(9, 20, 35, 0.90); /* Hextech Blue */
            border-left: 5px solid #c426a9; /* Hextech Gold */
            padding: 0 12px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            height: 72px; /* Hard-locked height */
            gap: 15px; /* Spacing between the sections */
        }

        .stat-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-divider {
            width: 2px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15); /* Subtle transparent line */
            border-radius: 2px;
        }

        .stat-section h2 {
            margin-top: 3px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #aaaaaa;
            margin-bottom: 0px;
            white-space: nowrap;
        }

        .stat-text {
            margin-top: 3px;
            font-size: 26px;
            font-weight: 800;
            position: relative;
            top: 0px; /* Perfect vertical alignment */
            white-space: nowrap;
        }

        /* Rank specific tweaks for the flex layout */
        .rank-display {
            display: flex;
            align-items: center;
        }

        /* Streak popup positioning fix for the unified bar */
        .streak-container {
            display: none; 
            position: absolute; 
            bottom: 100%; 
            left: 10px; 
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 800;
            color: #ffaa00; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
            white-space: nowrap; 
        }

        /* --- RIGHT SIDEBAR --- */
        .right-sidebar {
            position: absolute;
            top: 15px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* --- TOP CHARACTERS --- */
        .leaderboard {
            background: rgba(20, 20, 25, 0.85);
            padding: 15px;
            border: 1px solid #c426a9;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 260px;
            display: block; 
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            margin-bottom: 5px;
        }

        .leaderboard-header h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #aaaaaa;
        }

        h2.header-winrate {
            font-size: 10px;
            color: #c426a9;
            letter-spacing: 1px;
        }

        .char-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .char-row:last-child {
            margin-bottom: 0;
        }

        /* Avatar Container */
        .char-avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background: #333;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden; 
        }

        /* Image specific styling */
        .char-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center top; 
        }

        .char-info {
            flex-grow: 1;
        }

        .char-name {
            font-size: 15px;
            font-weight: 600;
        }

        .char-stats {
            font-size: 12px;
            color: #bbbbbb;
        }

        .char-winrate {
            font-size: 16px;
            font-weight: 700;
            color: #c426a9;
            text-align: right;
            min-width: 50px;
        }

        

        

        .rank-display {
            display: flex;
            align-items: center;
        }

        .rank-icon {
            width: 40px;
            height: 40px;
            margin-right: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #c426a9;
        }

        .rank-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        

        .streak-container {
            display: none; 
            position: absolute; 
            bottom: 100%; 
            left: 0; 
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: 800;
            color: #ffaa00; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.6);
            white-space: nowrap; 
        }

        .last-5-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            background: rgba(20, 20, 25, 0.85);
            padding: 15px;
            border: 1px solid #c426a9;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 260px;
            display: block; 
        
        }

        .last-5-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .last-5-title {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: -1px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
            

        }
        .matches-wrapper {
            display: flex;
            gap: 5px;
        }
        .match-box {
            width: 38px;
            height: 38px;
            border-radius: 5px;
            position: relative;
            background-size: cover;
            background-position: center;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .match-box.win {
            border-color: #4ade80;
        }
        .match-box.loss {
            border-color: #ef4444;
        }
        .match-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            font-size: 9px;
            font-weight: 900;
            padding: 1px 5px;
            border-top-right-radius: 4px;
            text-shadow: none;
        }
        .match-box.win .match-badge {
            background-color: #4ade80;
            color: #052e16;
        }
        .match-box.loss .match-badge {
            background-color: #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="stat-bar" id="stat-bar-container">
        <div class="streak-container" id="streak-display">🔥 2 WINS</div>
        
        <div class="stat-section" id="record-container">
            <h2 id="record-title">Weekly Record</h2>
            <div class="stat-text" id="record-display">0W - 0L</div>
        </div>

        <div class="stat-divider" id="stat-divider"></div>

        <div class="stat-section" id="rank-container">
            <h2>Current Rank</h2>
            <div class="rank-display">
                <div class="rank-icon" id="rank-icon-wrapper" style="display: none;"></div>
                <div class="stat-text" id="rank-text-display">Unranked</div>
            </div>
        </div>
    </div>

    <div class="right-sidebar">

        <div class="leaderboard" id="leaderboard-container">
            <div class="leaderboard-header">
                <h2>Top Characters</h2>
                <h2 class="header-winrate">WIN %</h2>
            </div>
            <div id="characters-list">
            </div>
        </div>

        <div class="last-5-container" id="last-5-section">
            <div class="last-5-header">
                <div class="last-5-title">Last 5 Games</div>
            </div>
            <div class="matches-wrapper" id="matches-wrapper">
            </div>
        </div>

    </div>

    <script>
        let lastDataString = "";

        async function updateOverlay() {
            try {
                const response = await fetch('data.json?cache_bypass=' + Date.now());
                if (!response.ok) return;
                
                const data = await response.json();
                const currentDataString = JSON.stringify(data);
                
                if (currentDataString === lastDataString) return;
                lastDataString = currentDataString;

                const rankEl = document.getElementById('rank-container');
                const showRank = data.settings ? (data.settings.show_rank !== false) : true;
                
                if (showRank && data.rank_info) {
                    rankEl.style.display = "block";
                    
                    const rankBase = data.rank_info.rank;
                    const division = data.rank_info.division;
                    const cleanRankName = rankBase.toLowerCase();

                    const fullRankText = rankBase === "Unranked" ? rankBase : `${rankBase} ${division}`;
                    document.getElementById('rank-text-display').innerText = fullRankText;

                    //const rankImageTag = `<img src="images/${cleanRankName}.png" onerror="this.onerror=null; this.parentNode.innerHTML='★';">`;
                    document.getElementById('rank-icon-wrapper').style.display = 'none';                    
                } else {
                    rankEl.style.display = "none";
                }

                const leaderboardEl = document.getElementById('leaderboard-container');
                const showLeaderboard = data.settings ? data.settings.show_leaderboard : true;
                
                if (showLeaderboard) {
                    leaderboardEl.style.display = "block";
                } else {
                    leaderboardEl.style.display = "none";
                }
                
                const recordEl = document.getElementById('record-container');
                const showRecord = data.settings ? (data.settings.show_record !== false) : true;
                
                if (showRecord) {
                    recordEl.style.display = "block";
                } else {
                    recordEl.style.display = "none";
                }

                const dividerEl = document.getElementById('stat-divider');
                if (showRank && showRecord) {
                    dividerEl.style.display = "block";
                } else {
                    dividerEl.style.display = "none";
                }

                const last5El = document.getElementById('last-5-section');
                const showLast5 = data.settings ? (data.settings.show_last5 !== false) : true;
                
                if (showLast5) {
                    last5El.style.display = "block";
                } else {
                    last5El.style.display = "none";
                }

                const recordType = data.weekly_record.type ? data.weekly_record.type : "Weekly Record";
                document.getElementById('record-title').innerText = recordType;
                
                document.getElementById('record-display').innerText = 
                    `${data.weekly_record.wins}W - ${data.weekly_record.losses}L`;

                const streakEl = document.getElementById('streak-display');
                const currentStreak = data.weekly_record.streak || 0;

                if (currentStreak >= 2) {
                    streakEl.innerText = `🔥 ${currentStreak} WINS`;
                    streakEl.style.display = "block";
                } else {
                    streakEl.style.display = "none";
                }

                const listContainer = document.getElementById('characters-list');
                listContainer.innerHTML = "";

                data.characters.forEach(char => {
                    const shortName = char.name.substring(0,2).toUpperCase();
                    
                    const cleanFileName = char.name.toLowerCase().replace(/'/g, '').replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
                    
                    let wr = char.winrate;
                    if (!wr.includes('%')) wr += '%';

                    const imageTag = `<img src="images/${cleanFileName}.png" onerror="this.onerror=null; this.parentNode.innerHTML='${shortName}';">`;

                    const rowHTML = `
                        <div class="char-row">
                            <div class="char-avatar">${imageTag}</div>
                            <div class="char-info">
                                <div class="char-name">${char.name}</div>
                                <div class="char-stats">${char.games} Games Played</div>
                            </div>
                            <div class="char-winrate">${wr}</div>
                        </div>
                    `;
                    listContainer.innerHTML += rowHTML;
                });

                const matchesWrapper = document.getElementById('matches-wrapper');
                matchesWrapper.innerHTML = ''; 

                if (data.last_5_games) {
                    data.last_5_games.forEach(match => {
                        if (match.char !== "None") {

                            const box = document.createElement('div');
                            box.className = `match-box ${match.result === 'Win' ? 'win' : 'loss'}`;
                            
                            let safeCharName = match.char.toLowerCase().replace(/'/g, '').replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
                            box.style.backgroundImage = `url('images/${safeCharName}.png')`;

                            const badge = document.createElement('div');
                            badge.className = 'match-badge';
                            badge.innerText = match.result === 'Win' ? 'W' : 'L';

                            box.appendChild(badge);
                            matchesWrapper.appendChild(box);
                        }
                    });
                }

            } catch (error) {
                console.log("Waiting for data...");
            }
        }

        setInterval(updateOverlay, 1500);
        updateOverlay();
    </script>
</body>
</html>
